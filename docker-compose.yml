services:
  teleglance:
    build: .
    image: teleglance-backend:local
    container_name: teleglance
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /models
      # Phone debug events (only sent while Settings > Debug events is on) are appended here, redacted and
      # size-capped. Remove this line to keep no debug file; keep ./logs private on the host (chmod 700).
      DEBUG_LOG_PATH: /logs/debug-events.jsonl
    networks:
      - homelab
    ports:
      # Loopback only (debugging). Clients reach the backend through Caddy, which proxies
      # teleglance.homelab.chanyaoying.com to teleglance:8787 over the shared Docker network.
      - "127.0.0.1:${BACKEND_PORT:-8788}:8787"
    volumes:
      - whisper-models:/models
      - ./logs:/logs

networks:
  # The network Caddy lives on (homelab compose project).
  homelab:
    name: homelab_app-network
    external: true

volumes:
  whisper-models:
