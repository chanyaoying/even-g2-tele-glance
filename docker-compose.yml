services:
  teleglance:
    build: .
    image: teleglance-backend:local
    container_name: teleglance
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /models
    networks:
      - homelab
    ports:
      # Loopback only (debugging). Clients reach the backend through Caddy, which proxies
      # teleglance.homelab.chanyaoying.com to teleglance:8787 over the shared Docker network.
      - "127.0.0.1:${BACKEND_PORT:-8788}:8787"
    volumes:
      - whisper-models:/models

  # Static frontend, used for Even Hub dev-server sideloading (`evenhub qr`).
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: teleglance-web:local
    container_name: teleglance-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

networks:
  # The network Caddy lives on (homelab compose project).
  homelab:
    name: homelab_app-network
    external: true

volumes:
  whisper-models:
